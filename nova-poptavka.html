<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nová poptávka | PLOTAO.cz</title><meta name="description" content="Odešlete poptávku na plot a získejte rychlou odpověď od PLOTAO.cz. Uveďte kontakt a popis vašeho projektu."><link rel="canonical" href="https://plotao.cz/nova-poptavka.html"><style>body{font-family:system-ui,sans-serif;background:#f5f7f8;margin:0;color:#18252b}.box{max-width:640px;margin:40px auto;padding:28px;background:white;border-radius:16px;box-shadow:0 8px 30px #0001}h1{margin-top:0}label{display:block;font-weight:600;margin:14px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd5d9;border-radius:8px;font:inherit}button{margin-top:20px;padding:13px 20px;border:0;border-radius:9px;background:#0b7a53;color:white;font-weight:700;font-size:1rem;cursor:pointer}button:disabled{opacity:.6}.status{margin-top:16px;padding:12px;border-radius:8px;display:none}.ok{display:block;background:#e8f7ef;color:#145b39}.err{display:block;background:#fff0f0;color:#8a1f1f}</style></head><body><main class="box"><h1>Odeslat poptávku</h1><p>Pošlete nám údaje a ozveme se vám.</p><form id="lead"><label for="name">Jméno a příjmení</label><input id="name" name="name" required><label for="phone">Telefon</label><input id="phone" name="phone" required><label for="email">E-mail</label><input id="email" name="email" type="email" required><label for="message">Zpráva</label><textarea id="message" name="message" rows="5" required></textarea><button id="send" type="submit">Odeslat poptávku</button><div id="status" class="status" role="status"></div></form></main><script>const form=document.querySelector('#lead'),btn=document.querySelector('#send'),status=document.querySelector('#status');form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;btn.disabled=true;btn.textContent='Odesílám…';status.className='status';status.textContent='';const f=new FormData(form);const lead={schemaVersion:2,mode:'lead',name:f.get('name'),phone:f.get('phone'),email:f.get('email'),message:f.get('message')};try{const r=await fetch('https://jmukoccjqykyoqsypuwb.supabase.co/functions/v1/submit-lead',{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify({transportVersion:1,source:'plotao.cz',submittedAt:new Date().toISOString(),lead})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||('HTTP '+r.status));status.className='status ok';status.textContent='Poptávka byla odeslána. Děkujeme.';form.reset()}catch(err){status.className='status err';status.textContent='Odeslání se nepodařilo: '+err.message}finally{btn.disabled=false;btn.textContent='Odeslat poptávku'}});</script><footer class="foot-bottom"><span>© PLOTAO.cz</span> <a href="/ochrana-osobnich-udaju.html" data-plotao-privacy-link="1">Ochrana osobních údajů</a></footer></body></html>
