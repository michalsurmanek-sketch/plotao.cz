name: Deploy Plotao.cz to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify calculator source integrity
        run: |
          set -euo pipefail
          legacy=(assets/calculator-v2.js assets/geometry-fix.js assets/concrete-price-guard.js assets/pricing-benchmark.js assets/pricing-benchmark-v2.js assets/pricing-benchmark-v3.js assets/pricing-benchmark-v4.js)
          for file in "${legacy[@]}"; do
            if [ -e "$file" ]; then echo "Legacy calculator module must stay deleted: $file"; exit 1; fi
          done
          for file in assets/*.js scripts/*.mjs; do node --check "$file"; done
          node scripts/build-pipeline-check.mjs
          node scripts/calculator-regression-check.mjs
          node scripts/options-state-check.mjs
          node scripts/ui-state-check.mjs

      - name: Prepare production Pages artifact
        run: node scripts/prepare-pages.mjs

      - name: Verify production artifact integrity
        run: node scripts/verify-pages-artifact.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
