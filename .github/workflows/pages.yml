name: Deploy Plotao.cz to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify calculator source integrity
        run: |
          set -euo pipefail
          legacy=(assets/calculator-v2.js assets/geometry-fix.js assets/concrete-price-guard.js assets/pricing-benchmark.js assets/pricing-benchmark-v2.js assets/pricing-benchmark-v3.js assets/pricing-benchmark-v4.js)
          for file in "${legacy[@]}"; do
            if [ -e "$file" ]; then echo "Legacy calculator module must stay deleted: $file"; exit 1; fi
          done
          for file in assets/*.js scripts/*.mjs; do node --check "$file"; done
          node scripts/build-pipeline-check.mjs
          node scripts/accessibility-shell-check.mjs
          node scripts/semantic-structure-check.mjs
          node scripts/source-boundary-check.mjs
          node scripts/calculator-regression-check.mjs
          node scripts/panel-pricing-scenario-check.mjs
          node scripts/mesh-pricing-scenario-check.mjs
          node scripts/gate-pricing-scenario-check.mjs
          node scripts/gate-drive-pricing-scenario-check.mjs
          node scripts/aluminium-pricing-scenario-check.mjs
          node scripts/height-boundary-check.mjs
          node scripts/privacy-pricing-scenario-check.mjs
          node scripts/structural-pricing-scenario-check.mjs
          node scripts/extra-fence-pricing-scenario-check.mjs
          node scripts/run-placement-integrity-check.mjs
          node scripts/closed-plot-geometry-check.mjs
          node scripts/rectangle-mode-source-check.mjs
          node scripts/material-validity-check.mjs
          node scripts/input-validity-guard-check.mjs
          node scripts/input-field-accessibility-check.mjs
          node scripts/segment-edit-state-check.mjs
          node scripts/segment-connections-check.mjs
          node scripts/segment-minimum-check.mjs
          node scripts/slab-pricing-scenario-check.mjs
          node scripts/slab-default-check.mjs
          node scripts/concrete-material-scenario-check.mjs
          node scripts/price-total-scenario-check.mjs
          node scripts/lead-scenario-check.mjs
          node scripts/lead-price-state-check.mjs
          node scripts/lead-option-integrity-check.mjs
          node scripts/modal-draft-isolation-check.mjs
          node scripts/modal-focus-containment-check.mjs
          node scripts/lead-mode-action-check.mjs
          node scripts/lead-scope-payload-check.mjs
          node scripts/lead-transport-scenario-check.mjs
          node scripts/lead-backend-source-check.mjs
          node scripts/options-state-check.mjs
          node scripts/ui-state-check.mjs
          node scripts/ux-regression-check.mjs
          node scripts/price-transition-check.mjs
          node scripts/total-ownership-check.mjs
          node scripts/result-row-state-check.mjs
          node scripts/mobile-summary-check.mjs
          node scripts/scope-truth-check.mjs
          node scripts/seo-regression-check.mjs
          node scripts/performance-budget-check.mjs

      - name: Prepare production Pages artifact
        run: node scripts/prepare-pages.mjs

      - name: Enrich production accessibility shell
        run: node scripts/enrich-accessibility-shell.mjs

      - name: Enrich metal configurator UI
        run: node scripts/enrich-metal-ui.mjs

      - name: Enrich atypical configurator UI
        run: node scripts/enrich-atypical-ui.mjs

      - name: Sanitize production structured data
        run: node scripts/enrich-structured-data.mjs

      - name: Verify production structured data
        run: node scripts/structured-data-artifact-check.mjs

      - name: Enrich production privacy UI
        run: node scripts/enrich-privacy-ui.mjs

      - name: Enrich production social metadata
        run: node scripts/enrich-social-meta.mjs

      - name: Verify discovery social artifact
        run: node scripts/social-artifact-check.mjs

      - name: Verify production artifact integrity
        run: node scripts/verify-pages-artifact.mjs

      - name: Run browser E2E on production artifact
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps --only-shell chromium
          python3 -m http.server 4173 --directory dist >/tmp/plotao-e2e-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          PLOTAO_E2E_URL=http://127.0.0.1:4173 npm run browser:e2e
          PLOTAO_E2E_URL=http://127.0.0.1:4173 node scripts/free-route-browser-check.mjs
          PLOTAO_E2E_URL=http://127.0.0.1:4173 node scripts/segment-add-position-browser-check.mjs
          PLOTAO_E2E_URL=http://127.0.0.1:4173 node scripts/focus-visible-browser-check.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload public site only
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify live custom domain
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          marker_url="https://plotao.cz/deploy-marker.txt?sha=${EXPECTED_SHA}"
          html_url="https://plotao.cz/?sha=${EXPECTED_SHA}"
          expected_meta="<meta name=\"plotao-deploy\" content=\"${EXPECTED_SHA}\">"
          private_paths=(
            "/scripts/seo-regression-check.mjs"
            "/supabase/functions/submit-lead/index.ts"
            "/docs/lead-backend-contract.md"
          )
          contains() {
            [[ "$1" == *"$2"* ]]
          }
          verify_private_paths() {
            for path in "${private_paths[@]}"; do
              code="$(curl -sSL --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://plotao.cz${path}?sha=${EXPECTED_SHA}" || true)"
              if [ "$code" != "404" ]; then
                echo "Internal source path must stay unpublished: path=$path status=${code:-<empty>}"
                return 1
              fi
              echo "Internal source path correctly returns 404: $path"
            done
          }
          for attempt in $(seq 1 18); do
            actual="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$marker_url" 2>/dev/null | tr -d '\r\n' || true)"
            page="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$html_url" 2>/dev/null || true)"
            marker_ok=0
            html_ok=0
            [ "$actual" = "$EXPECTED_SHA" ] && marker_ok=1
            contains "$page" "$expected_meta" && html_ok=1 || true
            if [ "$marker_ok" = 1 ] && [ "$html_ok" = 1 ]; then
              verify_private_paths
              echo "Live custom domain serves expected public deploy and keeps repository internals unpublished: $EXPECTED_SHA"
              exit 0
            fi
            echo "Attempt $attempt: marker_ok=$marker_ok html_ok=$html_ok expected=$EXPECTED_SHA actual=${actual:-<empty>}"
            sleep 10
          done
          echo "plotao.cz did not expose the expected deploy marker consistently in both marker file and HTML"
          exit 1

      - name: Verify live mesh has no surface selector
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          await page.goto(`https://plotao.cz/?type=mesh&sha=${process.env.EXPECTED_SHA}#kalkulator`,{waitUntil:'networkidle',timeout:60000});
          await page.waitForSelector('#fenceVisualRoot[data-type="mesh"]',{timeout:15000});
          const bad=await page.locator('#fenceVisualRoot[data-type="mesh"] .pc-control').evaluateAll(nodes=>nodes.filter(n=>/^Povrch$/i.test(n.querySelector('strong')?.textContent?.trim()||'')||n.querySelector('[data-g="c"],[data-ms]')).length);
          if(bad)throw new Error('Live mesh still contains legacy surface selector');
          console.log('Live mesh verified: no surface selector');
          await browser.close();
          NODE

      - name: Capture live mobile configurator screenshot
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1100},deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto(`https://plotao.cz/?sha=${process.env.EXPECTED_SHA}`,{waitUntil:'networkidle',timeout:60000});
          const mobile=page.locator('.type[data-id="mobile"]');
          await mobile.waitFor({state:'visible',timeout:15000});
          await mobile.click();
          const config=page.locator('#extraFenceConfig[data-type="mobile"]');
          await config.waitFor({state:'visible',timeout:15000});
          await config.locator('[data-ev="solid"]').click();
          await page.waitForFunction(()=>document.querySelector('#extraFenceConfig .mobile-product h3')?.textContent?.includes('Plný panel 2,8 × 2,0 m'),null,{timeout:15000});
          await config.scrollIntoViewIfNeeded();
          await page.waitForTimeout(800);
          await config.screenshot({path:'live-mobile-config.png'});
          const text=(await config.innerText()).trim();
          if(!text.includes('Konfigurace mobilního oplocení')||!text.includes('Plný panel 2,8 × 2,0 m')||!text.includes('Více soukromí'))throw new Error('Live full-panel configurator content missing');
          if(errors.length)throw new Error('Live browser page errors: '+errors.join(' | '));
          console.log('Live full-panel configurator screenshot captured from production');
          await browser.close();
          NODE

      - name: Upload live visual proof
        uses: actions/upload-artifact@v4
        with:
          name: live-mobile-config-${{ github.sha }}
          path: live-mobile-config.png
          retention-days: 3