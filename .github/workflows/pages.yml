name: Deploy Plotao.cz to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify calculator source integrity
        run: |
          set -euo pipefail
          legacy=(assets/calculator-v2.js assets/geometry-fix.js assets/concrete-price-guard.js assets/pricing-benchmark.js assets/pricing-benchmark-v2.js assets/pricing-benchmark-v3.js assets/pricing-benchmark-v4.js)
          for file in "${legacy[@]}"; do
            if [ -e "$file" ]; then echo "Legacy calculator module must stay deleted: $file"; exit 1; fi
          done
          for file in assets/*.js scripts/*.mjs; do node --check "$file"; done
          node scripts/build-pipeline-check.mjs
          node scripts/source-boundary-check.mjs
          node scripts/calculator-regression-check.mjs
          node scripts/panel-pricing-scenario-check.mjs
          node scripts/mesh-pricing-scenario-check.mjs
          node scripts/gate-pricing-scenario-check.mjs
          node scripts/gate-drive-pricing-scenario-check.mjs
          node scripts/aluminium-pricing-scenario-check.mjs
          node scripts/height-boundary-check.mjs
          node scripts/privacy-pricing-scenario-check.mjs
          node scripts/structural-pricing-scenario-check.mjs
          node scripts/extra-fence-pricing-scenario-check.mjs
          node scripts/slab-pricing-scenario-check.mjs
          node scripts/slab-default-check.mjs
          node scripts/concrete-material-scenario-check.mjs
          node scripts/price-total-scenario-check.mjs
          node scripts/lead-scenario-check.mjs
          node scripts/lead-option-integrity-check.mjs
          node scripts/modal-draft-isolation-check.mjs
          node scripts/lead-mode-action-check.mjs
          node scripts/lead-scope-payload-check.mjs
          node scripts/lead-transport-scenario-check.mjs
          node scripts/lead-backend-source-check.mjs
          node scripts/options-state-check.mjs
          node scripts/ui-state-check.mjs
          node scripts/ux-regression-check.mjs
          node scripts/price-transition-check.mjs
          node scripts/result-row-state-check.mjs
          node scripts/mobile-summary-check.mjs
          node scripts/scope-truth-check.mjs
          node scripts/seo-regression-check.mjs

      - name: Prepare production Pages artifact
        run: node scripts/prepare-pages.mjs

      - name: Verify production artifact integrity
        run: node scripts/verify-pages-artifact.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live custom domain
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          marker_url="https://plotao.cz/deploy-marker.txt?sha=${EXPECTED_SHA}"
          html_url="https://plotao.cz/?sha=${EXPECTED_SHA}"
          expected_meta="<meta name=\"plotao-deploy\" content=\"${EXPECTED_SHA}\">"
          for attempt in $(seq 1 18); do
            actual="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$marker_url" 2>/dev/null | tr -d '\r\n' || true)"
            page="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$html_url" 2>/dev/null || true)"
            marker_ok=0
            html_ok=0
            [ "$actual" = "$EXPECTED_SHA" ] && marker_ok=1
            printf '%s' "$page" | grep -Fq "$expected_meta" && html_ok=1 || true
            if [ "$marker_ok" = 1 ] && [ "$html_ok" = 1 ]; then
              echo "Live custom domain serves expected deploy in marker and HTML: $EXPECTED_SHA"
              exit 0
            fi
            echo "Attempt $attempt: marker_ok=$marker_ok html_ok=$html_ok expected=$EXPECTED_SHA actual=${actual:-<empty>}"
            sleep 10
          done
          echo "plotao.cz did not expose the expected deploy marker consistently in both marker file and HTML"
          exit 1
