name: Migrate Plotao index source

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/migrate-index-source.mjs"
      - ".github/workflows/migrate-index-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plotao-index-source-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify migration script syntax
        run: node --check scripts/migrate-index-source.mjs

      - name: Migrate index source
        run: node scripts/migrate-index-source.mjs

      - name: Verify only index changed
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Index source already migrated"
            exit 0
          fi
          if [ "$changed" != "index.html" ]; then
            echo "Unexpected migration changes:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit migrated index
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Migrate legacy inline pricing out of index source"
          git push origin HEAD:main
