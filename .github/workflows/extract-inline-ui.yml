name: Extract Plotao inline UI

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/extract-inline-ui.mjs"
      - ".github/workflows/extract-inline-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plotao-inline-ui-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify extraction script
        run: node --check scripts/extract-inline-ui.mjs
      - name: Extract inline UI
        run: node scripts/extract-inline-ui.mjs
      - name: Verify only index changed
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then echo "Inline UI already extracted"; exit 0; fi
          if [ "$changed" != "index.html" ]; then echo "Unexpected extraction changes:"; printf '%s\n' "$changed"; exit 1; fi
      - name: Commit extracted UI
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then echo "Nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Extract calculator UI bootstrap from index"
          git push origin HEAD:main
