name: Verify live Plotao.cz

on:
  workflow_run:
    workflows: ["Deploy Plotao.cz to Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-live:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed marker, HTML, privacy, structured data, social metadata and private paths on custom domain
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          marker_url="https://plotao.cz/deploy-marker.txt?sha=${EXPECTED_SHA}"
          html_url="https://plotao.cz/?sha=${EXPECTED_SHA}"
          privacy_url="https://plotao.cz/ochrana-osobnich-udaju.html?sha=${EXPECTED_SHA}"
          sitemap_url="https://plotao.cz/sitemap.xml?sha=${EXPECTED_SHA}"
          expected_meta="<meta name=\"plotao-deploy\" content=\"${EXPECTED_SHA}\">"
          expected_privacy_href='href="/ochrana-osobnich-udaju.html"'
          expected_privacy_link='data-plotao-privacy-link="1"'
          expected_privacy_notice='data-plotao-privacy-notice="1"'
          expected_privacy_robots='<meta name="robots" content="noindex,follow">'
          expected_controller_email='<a href="mailto:info@slevao.cz">info@slevao.cz</a>'
          expected_form_boundary='Poptávkový formulář PLOTAO.cz není určen pro žádosti týkající se ochrany osobních údajů.'
          social_pages=(
            "/|panelovy-3d.webp"
            "/typy-plotu.html|panelovy-3d.webp"
            "/panelovy-plot.html|panelovy-3d.webp"
            "/pletivovy-plot.html|pletivovy.webp"
            "/betonovy-plot.html|betonovy.webp"
            "/hlinikovy-plot.html|hlinikovy.webp"
            "/plot-na-soukromi.html|soukromi-lamely.webp"
            "/gabionovy-plot.html|gabionovy.webp"
            "/kovovy-plot.html|category-metal.webp"
            "/zdeny-plot.html|category-masonry.webp"
            "/mobilni-oploceni.html|category-mobile.webp"
            "/specialni-oploceni.html|category-other.webp"
          )
          structured_pages=(
            "/panelovy-plot.html"
            "/pletivovy-plot.html"
            "/betonovy-plot.html"
            "/hlinikovy-plot.html"
            "/plot-na-soukromi.html"
            "/gabionovy-plot.html"
            "/kovovy-plot.html"
            "/zdeny-plot.html"
            "/mobilni-oploceni.html"
            "/specialni-oploceni.html"
          )
          private_paths=(
            "/scripts/seo-regression-check.mjs"
            "/supabase/functions/submit-lead/index.ts"
            "/docs/lead-backend-contract.md"
          )
          contains() {
            [[ "$1" == *"$2"* ]]
          }
          verify_private_paths() {
            for path in "${private_paths[@]}"; do
              code="$(curl -sSL --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://plotao.cz${path}?sha=${EXPECTED_SHA}" || true)"
              if [ "$code" != "404" ]; then
                echo "Internal source path must stay unpublished: path=$path status=${code:-<empty>}"
                return 1
              fi
              echo "Internal source path correctly returns 404: $path"
            done
          }
          verify_sitemap() {
            local sitemap="$1" entry path loc
            if contains "$sitemap" '<loc>https://plotao.cz/ochrana-osobnich-udaju.html</loc>'; then
              echo "Noindex privacy page must stay excluded from live sitemap"
              return 1
            fi
            for entry in "${social_pages[@]}"; do
              path="${entry%%|*}"
              if [ "$path" = "/" ]; then
                loc='<loc>https://plotao.cz/</loc>'
              else
                loc="<loc>https://plotao.cz${path}</loc>"
              fi
              if ! contains "$sitemap" "$loc"; then
                echo "Live sitemap missing discovery URL: $path"
                return 1
              fi
            done
            echo "Live sitemap OK: all 12 discovery URLs present; privacy page excluded"
          }
          verify_social_pages() {
            local entry path image page image_url expected_og expected_secure expected_twitter expected_twitter_image
            for entry in "${social_pages[@]}"; do
              path="${entry%%|*}"
              image="${entry##*|}"
              page="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://plotao.cz${path}?sha=${EXPECTED_SHA}" 2>/dev/null || true)"
              image_url="https://plotao.cz/assets/fence-types/${image}"
              expected_og="<meta property=\"og:image\" content=\"${image_url}\">"
              expected_secure="<meta property=\"og:image:secure_url\" content=\"${image_url}\">"
              expected_twitter='<meta name="twitter:card" content="summary_large_image">'
              expected_twitter_image="<meta name=\"twitter:image\" content=\"${image_url}\">"
              if ! contains "$page" "$expected_og" \
                || ! contains "$page" "$expected_secure" \
                || ! contains "$page" "$expected_twitter" \
                || ! contains "$page" "$expected_twitter_image"; then
                echo "Social preview metadata mismatch: path=$path image=$image"
                return 1
              fi
              if ! contains "$page" "$expected_privacy_link" \
                || ! contains "$page" "$expected_privacy_href"; then
                echo "Public footer privacy link missing: path=$path"
                return 1
              fi
              if ! curl -fsS --connect-timeout 10 --max-time 20 -o /dev/null -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${image_url}?sha=${EXPECTED_SHA}"; then
                echo "Social preview image is not publicly reachable: $image_url"
                return 1
              fi
              echo "Discovery page OK: $path -> $image + privacy footer"
            done
          }
          verify_structured_data_pages() {
            local path page
            for path in "${structured_pages[@]}"; do
              page="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://plotao.cz${path}?sha=${EXPECTED_SHA}" 2>/dev/null || true)"
              if ! contains "$page" '"@type":"BreadcrumbList"'; then
                echo "Live landing page missing BreadcrumbList structured data: $path"
                return 1
              fi
              if contains "$page" '"@type":"FAQPage"'; then
                echo "Deprecated FAQPage structured data returned on live landing page: $path"
                return 1
              fi
              echo "Structured data OK: $path -> BreadcrumbList, no FAQPage"
            done
          }
          for attempt in $(seq 1 18); do
            actual="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$marker_url" 2>/dev/null | tr -d '\r\n' || true)"
            page="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$html_url" 2>/dev/null || true)"
            privacy="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$privacy_url" 2>/dev/null || true)"
            sitemap="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$sitemap_url" 2>/dev/null || true)"
            marker_ok=0
            html_ok=0
            privacy_ok=0
            home_privacy_href_ok=0
            home_privacy_link_ok=0
            home_privacy_notice_ok=0
            privacy_h1_ok=0
            privacy_controller_ok=0
            privacy_email_ok=0
            privacy_boundary_ok=0
            privacy_robots_ok=0
            [ "$actual" = "$EXPECTED_SHA" ] && marker_ok=1
            contains "$page" "$expected_meta" && html_ok=1 || true
            contains "$page" "$expected_privacy_href" && home_privacy_href_ok=1 || true
            contains "$page" "$expected_privacy_link" && home_privacy_link_ok=1 || true
            contains "$page" "$expected_privacy_notice" && home_privacy_notice_ok=1 || true
            contains "$privacy" '<h1>Ochrana osobních údajů</h1>' && privacy_h1_ok=1 || true
            contains "$privacy" 'AO Holding s.r.o.' && privacy_controller_ok=1 || true
            contains "$privacy" "$expected_controller_email" && privacy_email_ok=1 || true
            contains "$privacy" "$expected_form_boundary" && privacy_boundary_ok=1 || true
            contains "$privacy" "$expected_privacy_robots" && privacy_robots_ok=1 || true
            if [ "$home_privacy_href_ok" = 1 ] \
              && [ "$home_privacy_link_ok" = 1 ] \
              && [ "$home_privacy_notice_ok" = 1 ] \
              && [ "$privacy_h1_ok" = 1 ] \
              && [ "$privacy_controller_ok" = 1 ] \
              && [ "$privacy_email_ok" = 1 ] \
              && [ "$privacy_boundary_ok" = 1 ] \
              && [ "$privacy_robots_ok" = 1 ]; then
              privacy_ok=1
            fi
            if [ "$marker_ok" = 1 ] && [ "$html_ok" = 1 ] && [ "$privacy_ok" = 1 ]; then
              if verify_sitemap "$sitemap" && verify_social_pages && verify_structured_data_pages; then
                verify_private_paths
                echo "Live smoke confirms expected public deploy, privacy noindex + sitemap exclusion, verified controller contact, privacy information, social previews, sanitized structured data and private repository paths: $EXPECTED_SHA"
                exit 0
              fi
            fi
            echo "Attempt $attempt: marker_ok=$marker_ok html_ok=$html_ok privacy_ok=$privacy_ok home_href=$home_privacy_href_ok home_link=$home_privacy_link_ok home_notice=$home_privacy_notice_ok privacy_h1=$privacy_h1_ok privacy_controller=$privacy_controller_ok privacy_email=$privacy_email_ok privacy_boundary=$privacy_boundary_ok privacy_robots=$privacy_robots_ok expected=$EXPECTED_SHA actual=${actual:-<empty>}"
            sleep 10
          done
          echo "plotao.cz did not expose the expected deploy marker, HTML identity, privacy noindex/sitemap state, verified controller contact, privacy information, social previews and sanitized landing structured data consistently"
          exit 1
