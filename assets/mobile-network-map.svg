<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 110" role="img" aria-labelledby="title desc">
<title id="title">Mapa České republiky se sítí plotových center</title>
<desc id="desc">Zelená mapa České republiky s osmi oranžovými značkami umístěnými uvnitř obrysu.</desc>
<defs>
  <filter id="threshold" color-interpolation-filters="sRGB" x="-6%" y="-6%" width="112%" height="112%">
    <feColorMatrix type="saturate" values="0" result="gray"/>
    <feComponentTransfer in="gray">
      <feFuncR type="linear" slope="3.2" intercept="-0.95"/>
      <feFuncG type="linear" slope="3.2" intercept="-0.95"/>
      <feFuncB type="linear" slope="3.2" intercept="-0.95"/>
      <feFuncA type="identity"/>
    </feComponentTransfer>
  </filter>
  <filter id="outline" color-interpolation-filters="sRGB" x="-6%" y="-6%" width="112%" height="112%">
    <feColorMatrix type="saturate" values="0" result="gray"/>
    <feComponentTransfer in="gray" result="threshold">
      <feFuncR type="linear" slope="3.2" intercept="-0.95"/>
      <feFuncG type="linear" slope="3.2" intercept="-0.95"/>
      <feFuncB type="linear" slope="3.2" intercept="-0.95"/>
      <feFuncA type="identity"/>
    </feComponentTransfer>
    <feMorphology in="threshold" operator="dilate" radius="2.5"/>
  </filter>
  <mask id="land" maskUnits="userSpaceOnUse" x="0" y="0" width="220" height="110">
    <image href="/assets/czech-republic-regions.png" x="6" y="9" width="208" height="92" preserveAspectRatio="none" filter="url(#threshold)"/>
  </mask>
  <mask id="border" maskUnits="userSpaceOnUse" x="0" y="0" width="220" height="110">
    <image href="/assets/czech-republic-regions.png" x="6" y="9" width="208" height="92" preserveAspectRatio="none" filter="url(#outline)"/>
  </mask>
</defs>
<rect width="220" height="110" fill="#087443" mask="url(#border)"/>
<rect width="220" height="110" fill="#dcefe1" mask="url(#land)"/>
<g fill="#ff7a18" stroke="#fff" stroke-width="1.2" stroke-linejoin="round">
  <path d="M35 56c-2.5-3.1-6-6.2-6-10a6 6 0 1 1 12 0c0 3.8-3.5 6.9-6 10z"/><circle cx="35" cy="46" r="1.8" fill="#fff" stroke="none"/>
  <path d="M65 55c-2.5-3.1-6-6.2-6-10a6 6 0 1 1 12 0c0 3.8-3.5 6.9-6 10z"/><circle cx="65" cy="45" r="1.8" fill="#fff" stroke="none"/>
  <path d="M90 39c-2.5-3.1-6-6.2-6-10a6 6 0 1 1 12 0c0 3.8-3.5 6.9-6 10z"/><circle cx="90" cy="29" r="1.8" fill="#fff" stroke="none"/>
  <path d="M110 50c-2.5-3.1-6-6.2-6-10a6 6 0 1 1 12 0c0 3.8-3.5 6.9-6 10z"/><circle cx="110" cy="40" r="1.8" fill="#fff" stroke="none"/>
  <path d="M130 55c-2.5-3.1-6-6.2-6-10a6 6 0 1 1 12 0c0 3.8-3.5 6.9-6 10z"/><circle cx="130" cy="45" r="1.8" fill="#fff" stroke="none"/>
  <path d="M150 64c-2.5-3.1-6-6.2-6-10a6 6 0 1 1 12 0c0 3.8-3.5 6.9-6 10z"/><circle cx="150" cy="54" r="1.8" fill="#fff" stroke="none"/>
  <path d="M168 61c-2.5-3.1-6-6.2-6-10a6 6 0 1 1 12 0c0 3.8-3.5 6.9-6 10z"/><circle cx="168" cy="51" r="1.8" fill="#fff" stroke="none"/>
  <path d="M185 70c-2.5-3.1-6-6.2-6-10a6 6 0 1 1 12 0c0 3.8-3.5 6.9-6 10z"/><circle cx="185" cy="60" r="1.8" fill="#fff" stroke="none"/>
</g>
</svg>