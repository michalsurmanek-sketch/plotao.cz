<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Rozhodnutí k nabídce | PLOTAO.cz"><link rel="stylesheet" href="/assets/admin/admin-v1.css?v=20260930-3"></head><body class="public-decision"><main class="decision-shell"><a href="/" class="decision-brand">PLOTAO<em>.cz</em></a><section class="decision-card"><span class="eyebrow">CENOVÁ NABÍDKA</span><h1 id="decisionTitle">Ověřuji odkaz…</h1><p id="decisionText">Načítám nabídku.</p><div id="offerDetails" class="offer-details" hidden></div><div id="decisionActions" class="decision-actions" hidden><button class="action" data-choose="accepted">Přijmout nabídku</button><button class="secondary" data-choose="declined">Odmítnout nabídku</button></div><small id="decisionStatus" role="status"></small></section><p class="decision-foot">PLOTAO.cz · Plotové centrum</p></main><script>
(()=>{const S='https://jmukoccjqykyoqsypuwb.supabase.co',K='sb_publishable_FSrTbgu1LeF9DNeam3ztwA_3dNHGq-V',F=S+'/functions/v1/quote-decision',p=new URLSearchParams(location.search),id=p.get('id'),token=p.get('token'),initial=p.get('decision');const title=document.querySelector('#decisionTitle'),desc=document.querySelector('#decisionText'),actions=document.querySelector('#decisionActions'),status=document.querySelector('#decisionStatus'),details=document.querySelector('#offerDetails');let chosen='';
async function run(){if(!id||!token){title.textContent='Odkaz není platný';desc.textContent='Zkontrolujte prosím celý odkaz z e-mailu.';return}const r=await fetch(F+'?resource=quote_decision&id='+encodeURIComponent(id)+'&token='+encodeURIComponent(token),{headers:{apikey:K}});let d={};try{d=await r.json()}catch{}if(!r.ok){title.textContent='Odkaz už nelze použít';desc.textContent='Nabídka už byla zpracována nebo odkaz není platný. Kontaktujte PLOTAO.cz.';return}title.textContent='Nabídka '+d.quote_number;desc.textContent='Zkontrolujte nabídku a vyberte své rozhodnutí.';renderDetails(d);actions.hidden=false;if(initial==='accepted'||initial==='declined')desc.textContent=initial==='accepted'?'Chcete nabídku přijmout? Potvrďte volbu tlačítkem níže.':'Chcete nabídku odmítnout? Potvrďte volbu tlačítkem níže.'}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}function money(v){return new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'CZK',maximumFractionDigits:2}).format(Number(v)||0)}function renderDetails(q){details.hidden=false;const lines=(q.items||[]).map(i=>'<tr><td><b>'+esc(i.product_name)+'</b>'+(i.description?'<small>'+esc(i.description)+'</small>':'')+'</td><td>'+esc(i.quantity)+' '+esc(i.unit)+'</td><td>'+money(Number(i.net_total)+Number(i.vat_total))+'</td></tr>').join('');details.innerHTML='<div class="offer-table"><table><thead><tr><th>Položka</th><th>Množství</th><th>Cena celkem</th></tr></thead><tbody>'+lines+'</tbody></table></div><div class="offer-sum"><span>Celkem bez DPH</span><b>'+money(q.net_total)+'</b><span>DPH</span><b>'+money(q.vat_total)+'</b><span>Celkem včetně DPH</span><strong>'+money(q.gross_total)+'</strong></div>'+(q.valid_until?'<p>Platnost nabídky do '+esc(new Date(q.valid_until+'T12:00:00').toLocaleDateString('cs-CZ'))+'</p>':'')+(q.note?'<p><b>Poznámka:</b> '+esc(q.note)+'</p>':'')+'<button type="button" class="secondary offer-print" onclick="window.print()">Vytisknout / Uložit jako PDF</button>'}async function choose(value){if(chosen)return;chosen=value;actions.hidden=true;status.textContent='Ukládám vaše rozhodnutí…';try{const r=await fetch(F,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({action:'customer_quote_decision',quote_id:id,token,status:value})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'decision_failed');title.textContent=value==='accepted'?'Děkujeme, nabídku jste přijali':'Rozhodnutí jsme zaznamenali';desc.textContent=value==='accepted'?'PLOTAO.cz vás bude kontaktovat ohledně dalšího postupu.':'Děkujeme za zprávu. V případě potřeby se vám ozveme.';status.textContent='Nabídka '+d.quote_number+' · '+new Date().toLocaleString('cs-CZ')}catch{chosen='';status.textContent='Rozhodnutí se nepodařilo uložit. Zkuste volbu znovu.';actions.hidden=false}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-choose]');if(b)choose(b.dataset.choose)});run().catch(()=>{title.textContent='Nabídku se nepodařilo načíst';desc.textContent='Zkuste prosím odkaz otevřít znovu.'})})();
</script></body></html>
