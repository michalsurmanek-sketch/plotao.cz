<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Rozhodnutí k nabídce | PLOTAO.cz"><link rel="stylesheet" href="/assets/admin/admin-v1.css?v=20260930-2"></head><body class="public-decision"><main class="decision-shell"><a href="/" class="decision-brand">PLOTAO<em>.cz</em></a><section class="decision-card"><span class="eyebrow">CENOVÁ NABÍDKA</span><h1 id="decisionTitle">Ověřuji odkaz…</h1><p id="decisionText">Načítám nabídku.</p><div id="decisionActions" class="decision-actions" hidden><button class="action" data-choose="accepted">Přijmout nabídku</button><button class="secondary" data-choose="declined">Odmítnout nabídku</button></div><small id="decisionStatus" role="status"></small></section><p class="decision-foot">PLOTAO.cz · Plotové centrum</p></main><script>
(()=>{const S='https://jmukoccjqykyoqsypuwb.supabase.co',K='sb_publishable_FSrTbgu1LeF9DNeam3ztwA_3dNHGq-V',F=S+'/functions/v1/quote-decision',p=new URLSearchParams(location.search),id=p.get('id'),token=p.get('token'),initial=p.get('decision');const title=document.querySelector('#decisionTitle'),desc=document.querySelector('#decisionText'),actions=document.querySelector('#decisionActions'),status=document.querySelector('#decisionStatus');let chosen='';
async function run(){if(!id||!token){title.textContent='Odkaz není platný';desc.textContent='Zkontrolujte prosím celý odkaz z e-mailu.';return}const r=await fetch(F+'?resource=quote_decision&id='+encodeURIComponent(id)+'&token='+encodeURIComponent(token),{headers:{apikey:K}});let d={};try{d=await r.json()}catch{}if(!r.ok){title.textContent='Odkaz už nelze použít';desc.textContent='Nabídka už byla zpracována nebo odkaz není platný. Kontaktujte PLOTAO.cz.';return}title.textContent='Nabídka '+d.quote_number;desc.textContent='Vyberte, zda nabídku přijímáte, nebo odmítáte.';actions.hidden=false;if(initial==='accepted'||initial==='declined')desc.textContent=initial==='accepted'?'Chcete nabídku přijmout? Potvrďte volbu tlačítkem níže.':'Chcete nabídku odmítnout? Potvrďte volbu tlačítkem níže.'}
async function choose(value){if(chosen)return;chosen=value;actions.hidden=true;status.textContent='Ukládám vaše rozhodnutí…';try{const r=await fetch(F,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({action:'customer_quote_decision',quote_id:id,token,status:value})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'decision_failed');title.textContent=value==='accepted'?'Děkujeme, nabídku jste přijali':'Rozhodnutí jsme zaznamenali';desc.textContent=value==='accepted'?'PLOTAO.cz vás bude kontaktovat ohledně dalšího postupu.':'Děkujeme za zprávu. V případě potřeby se vám ozveme.';status.textContent='Nabídka '+d.quote_number+' · '+new Date().toLocaleString('cs-CZ')}catch{chosen='';status.textContent='Rozhodnutí se nepodařilo uložit. Zkuste volbu znovu.';actions.hidden=false}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-choose]');if(b)choose(b.dataset.choose)});run().catch(()=>{title.textContent='Nabídku se nepodařilo načíst';desc.textContent='Zkuste prosím odkaz otevřít znovu.'})})();
</script></body></html>
